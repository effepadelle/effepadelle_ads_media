name: Posten op Instagram

# Elk kwartier kijken wat er het komende kwartier aan de beurt is, en dan tot
# de minuut wachten. Eerst was het een keer per uur, op :05, en dan ging een
# post van 17:30 pas om 18:05. Niet precies op het kwartier, want dan is het
# bij GitHub het drukst en schuift een taak soms een kwartier op.
on:
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      proef:
        description: "Alleen kijken, niets plaatsen"
        type: boolean
        default: false

# Nodig om gepost.json terug te schrijven: dat is hoe hij onthoudt wat er al
# uit is, en dus hoe hij niets twee keer doet.
permissions:
  contents: write

concurrency:
  group: posten
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # De tak zelf en niet de commit van toen de taak werd ingepland. Wacht
      # hij op een vorige ronde, dan moet hij zien wat die net postte.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Plaatsen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER: ${{ secrets.IG_USER }}
          # De sleutel van elk project in het plan, bij naam. Niet alle geheimen
          # in een keer: zo worden geheimen gestolen, en daarom hield GitHub elke
          # run tegen. Zet klaar in de planner vult dit blok met de projecten die
          # in het plan staan.
          # BEGIN SLEUTELS
          IG_TOKEN__EFFEPADELLE: ${{ secrets.IG_TOKEN__EFFEPADELLE }}
          IG_USER__EFFEPADELLE: ${{ secrets.IG_USER__EFFEPADELLE }}
          IG_TOKEN__ROKU_FILMS: ${{ secrets.IG_TOKEN__ROKU_FILMS }}
          IG_USER__ROKU_FILMS: ${{ secrets.IG_USER__ROKU_FILMS }}
          # EIND SLEUTELS
          IG_BASIS: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/gepland
          # Een tijd zonder zone (17:30) is Nederlandse tijd, niet UTC. Nieuwe
          # plannen hebben de zone erbij; dit is voor de oudere.
          TZ: Europe/Amsterdam
        run: node instagram.mjs ${{ inputs.proef && '--proef' || '' }}

      # Altijd, ook als het plaatsen rood werd. Mislukt er een post en wordt de
      # taak rood, dan moet wat WEL geplaatst is toch onthouden worden, anders
      # gaat het het uur erna nog een keer de deur uit.
      # Kan botsen met de planner, die intussen een nieuw plan zet. Dan de
      # nieuwste stand ophalen, gepost.json samenvoegen, en nog een keer.
      - name: Onthouden wat eruit is
        if: always()
        run: |
          if [ -z "$(git status --porcelain gepland/gepost.json)" ]; then exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          cp gepland/gepost.json /tmp/gepost-hier.json
          for poging in 1 2 3 4 5; do
            git fetch origin "${{ github.ref_name }}"
            git reset --hard "origin/${{ github.ref_name }}"
            node -e '
              const fs = require("fs");
              const lees = (f) => { try { return JSON.parse(fs.readFileSync(f, "utf8")); } catch (e) { return {}; } };
              const daar = lees("gepland/gepost.json"), hier = lees("/tmp/gepost-hier.json");
              fs.mkdirSync("gepland", { recursive: true });
              fs.writeFileSync("gepland/gepost.json", JSON.stringify(Object.assign({}, daar, hier), null, 2) + "\n");
            '
            git add gepland/gepost.json
            git diff --cached --quiet && exit 0
            git commit -m "Gepost op $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push origin "HEAD:${{ github.ref_name }}" && exit 0
            sleep $((poging * 3))
          done
          echo "gepost.json kon niet worden weggeschreven" >&2
          exit 1
